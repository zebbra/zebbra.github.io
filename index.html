<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --red: #f94141;
    --red-far: #8e2226;
    --bone: #fff;
    --smoke: #7d7d7d;
    --pad: clamp(20px, 4vw, 56px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  a { color: inherit; }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(var(--pad), env(safe-area-inset-top)) var(--pad)
             calc(clamp(190px, 38vh, 380px) + 12px);
    gap: clamp(18px, 3vh, 36px);
  }

  .wordmark { display: flex; align-items: center; gap: 12px; flex: none; }
  .mark { display: block; width: 34px; height: auto; }
  .mark path { fill: var(--red); }
  .wordmark span { font-size: 17px; color: var(--smoke); letter-spacing: -0.01em; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 30ch;
    gap: clamp(14px, 2vh, 24px);
  }

  h1 {
    margin: 0;
    font-size: clamp(38px, 8vw, 92px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.94;
  }

  p { margin: 0; font-size: clamp(16px, 2vw, 21px); font-weight: 300; color: var(--smoke); max-width: 34ch; }

  .go {
    align-self: flex-start;
    font-size: clamp(22px, 3.4vw, 38px);
    font-weight: 600;
    letter-spacing: -0.03em;
    text-decoration: none;
    padding-bottom: 12px;
    position: relative;
  }
  .go::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 5px;
    border-radius: 3px;
    background: #242424;
    overflow: hidden;
  }
  .go i {
    position: absolute;
    left: 0; bottom: 0;
    height: 5px;
    width: 100%;
    border-radius: 3px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left center;
    z-index: 1;
    animation: fill 3.6s linear 0.4s both;
  }
  .go:hover i, .go:focus-visible i { background: var(--bone); }
  @keyframes fill { to { transform: scaleX(1); } }
  body.stayed .go i { animation-play-state: paused; }

  .note { font-size: 14px; color: var(--smoke); }
  .note a { color: var(--smoke); text-decoration: none; }
  .note a:hover { color: var(--bone); }

  /* ---------- the meadow ---------- */

  .scene {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: clamp(190px, 38vh, 380px);
    z-index: 1;
    pointer-events: none;
  }
  .row { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; }
  .row svg { flex: 0 0 auto; height: 100%; width: auto; aspect-ratio: 40 / 62; display: block; }
  .row.far { height: 74%; color: var(--red-far); left: -4%; right: -4%; }
  .row.near { height: 100%; color: var(--red); left: -6%; right: -6%; }

  .blades {
    transform-origin: 50% 60px;
    animation: sway var(--dur, 4s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.2deg); }
    50%      { transform: rotate(2.8deg); }
  }

  #zebra {
    position: absolute;
    bottom: 3%;
    left: 52%;
    width: clamp(280px, 34vw, 470px);
    height: auto;
    overflow: visible;
    animation: rise 1.1s cubic-bezier(0.18, 1.3, 0.36, 1) 0.4s both;
  }
  @keyframes rise {
    from { transform: translateY(64%); }
    to   { transform: translateY(0); }
  }
  /* grazing on the way up, then it notices you and lifts its head */
  .chew {
    transform-origin: 76px 32px;
    animation: neck-up 0.66s cubic-bezier(0.3, 1.45, 0.5, 1) 1.55s both;
  }
  .head {
    transform-origin: 98px 66px;
    animation: head-level 0.66s cubic-bezier(0.3, 1.45, 0.5, 1) 1.55s both;
  }
  @keyframes neck-up {
    from { transform: rotate(4deg); }
    to   { transform: rotate(-110deg); }
  }
  /* the poll bends back the other way, so the muzzle ends up forward, not skyward */
  @keyframes head-level {
    from { transform: rotate(0deg); }
    to   { transform: rotate(70deg); }
  }
  .tail { animation: swish 2.8s ease-in-out 1.4s infinite alternate; transform-origin: 22px 32px; }
  @keyframes swish { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }

  @media (max-width: 620px) {
    main { max-width: none; }
    #zebra { left: auto; right: -4%; bottom: 26%; width: 250px; }
    .scene { height: clamp(170px, 30vh, 260px); }
    .page { padding-bottom: calc(clamp(170px, 30vh, 260px) + 12px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blades, .tail, #zebra, .chew, .head { animation: none !important; }
    .chew { transform: rotate(-110deg); }
    .head { transform: rotate(70deg); }
    .go i { animation: fill 3.6s linear 0.4s both; }
  }
</style>
</head>
<body>

        <path d="M13.82,129.84c-3.53,0-7.06-1.35-9.76-4.04-5.39-5.39-5.39-14.13,0-19.52L106.26,4.07c5.39-5.39,14.13-5.39,19.52,0,5.39,5.39,5.39,14.13,0,19.52L23.58,125.79c-2.69,2.69-6.23,4.04-9.76,4.04Z"/>
        <path d="M89.22,205.23c-3.53,0-7.06-1.35-9.76-4.04-5.39-5.39-5.39-14.13,0-19.52l102.2-102.21c5.39-5.39,14.13-5.39,19.52,0,5.39,5.39,5.39,14.13,0,19.52l-102.2,102.21c-2.69,2.69-6.23,4.04-9.76,4.04Z"/>
        <path d="M13.8,205.24c-3.53,0-7.06-1.35-9.76-4.04-5.39-5.39-5.39-14.13,0-19.52L181.65,4.04c5.39-5.39,14.13-5.39,19.52,0,5.39,5.39,5.39,14.13,0,19.52L23.56,201.2c-2.69,2.69-6.23,4.04-9.76,4.04Z"/>
    </svg>
    <span>zebbra</span>
  </div>

  <main>
    <h1>Different meadow.</h1>
    <p>This is only our GitHub corner. The company itself grazes over at zebbra.ch, and you are on your way there.</p>
    <a class="go" id="go" href="https://zebbra.ch/">zebbra.ch<i></i></a>
    <p class="note" id="note">Grown here: <a href="https://github.com/zebbra/zebra-timer">zebra timer</a>. Click anywhere to stay.</p>
  </main>
</div>

<div class="scene" aria-hidden="true">

    <defs>

    <g class="tail">

<script>
  'use strict';

  /* Same blades as the timer: one stroke language for grass, stripes and mark. */
  function rng(seed) {
    let s = seed * 2654435761 % 4294967296;
    return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  }

  function tuft(i) {
    const r = rng(i + 7);
    const n = 7 + Math.floor(r() * 3);
    let lines = '';
    for (let b = 0; b < n; b++) {
      const x0 = -2 + (b * 44) / (n - 1) + (r() - 0.5) * 5;
      const len = 22 + r() * 30;
      const lean = 0.26 + r() * 0.24;
      const x1 = x0 + len * lean, y1 = 60 - len;
      const op = (0.74 + r() * 0.26).toFixed(2);
      if (r() < 0.28) {
        const mx = x0 + (x1 - x0) * 0.5, my = 60 + (y1 - 60) * 0.5;
        const gx = x0 + (x1 - x0) * 0.68, gy = 60 + (y1 - 60) * 0.68;
        lines += `<line x1="${x0.toFixed(1)}" y1="60" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" opacity="${op}"/>`;
        lines += `<line x1="${gx.toFixed(1)}" y1="${gy.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" opacity="${op}"/>`;
      } else {
        lines += `<line x1="${x0.toFixed(1)}" y1="60" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" opacity="${op}"/>`;
      }
    }
    // the delay walks along the row, so the gust travels instead of pulsing
    const delay = (i * 0.17).toFixed(2), dur = (3.4 + (i % 5) * 0.28).toFixed(2);
    return `<svg viewBox="0 0 40 62" preserveAspectRatio="xMidYMax meet" style="--delay:${delay}s;--dur:${dur}s">`
         + `<g class="blades" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">${lines}</g></svg>`;
  }

  const sow = (el, count, seed) => {
    el.innerHTML = Array.from({ length: count }, (_, i) => tuft(seed + i)).join('');
  };
  sow(document.getElementById('rowFar'), 34, 120);
  sow(document.getElementById('rowNear'), 30, 40);

  /* ---------- move along ---------- */

  const TARGET = 'https://zebbra.ch/';
  const WAIT = 5500;
  let timer = setTimeout(() => location.replace(TARGET), WAIT);

  function stay() {
    if (!timer) return;
    clearTimeout(timer);
    timer = null;
    document.body.classList.add('stayed');
    document.getElementById('note').innerHTML =
      'Staying put. <a href="https://github.com/zebbra/zebra-timer">zebra timer</a> grew here.';
  }
  // anyone who reaches for the page wants to read it, not be moved
  addEventListener('pointerdown', stay);
  addEventListener('keydown', stay);
  addEventListener('wheel', stay, { passive: true });
</script>
